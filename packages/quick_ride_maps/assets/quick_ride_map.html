<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="light">
  <title>Quick Ride Map</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.33.0/mapbox-gl.css" rel="stylesheet">
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #eef2f6; }
    .qr-marker { width: 18px; height: 18px; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 2px 8px rgba(0,0,0,.32); }
    .qr-marker.current { width: 19px; height: 19px; background: #2563eb; }
    .qr-marker.pickup { width: 17px; height: 17px; background: #159b65; }
    .qr-marker.destination { width: 17px; height: 17px; background: #d94747; }
    .mapboxgl-ctrl-bottom-left, .mapboxgl-ctrl-bottom-right { margin-bottom: 3px; }
    .mapboxgl-ctrl-top-right { margin-top: 8px; margin-right: 8px; }
    #map-error { display: none; position: absolute; left: 12px; right: 12px; top: 12px; padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,.96); color: #253044; font: 13px/1.4 sans-serif; box-shadow: 0 2px 10px rgba(0,0,0,.12); z-index: 10; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="map-error"></div>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.33.0/mapbox-gl.js"></script>
  <script>
    (function () {
      'use strict';
      let map = null;
      let pendingUpdate = null;
      const markers = {};

      function bridge(message) {
        try {
          if (window.QuickRideBridge && window.QuickRideBridge.postMessage) {
            window.QuickRideBridge.postMessage(message);
          }
        } catch (_) {}
      }

      function showError(message) {
        const node = document.getElementById('map-error');
        node.textContent = message;
        node.style.display = 'block';
        bridge('error:' + message);
      }

      function removeMarker(name) {
        if (markers[name]) {
          markers[name].remove();
          delete markers[name];
        }
      }

      function setMarker(name, point, visible) {
        if (!visible || !point ||
            typeof point.longitude !== 'number' ||
            typeof point.latitude !== 'number') {
          removeMarker(name);
          return;
        }
        const element = document.createElement('div');
        element.className = 'qr-marker ' + name;
        removeMarker(name);
        markers[name] = new mapboxgl.Marker({ element: element, anchor: 'center' })
          .setLngLat([point.longitude, point.latitude])
          .addTo(map);
      }

      function toFeatureCollection(points) {
        if (!Array.isArray(points) || points.length < 2) {
          return { type: 'FeatureCollection', features: [] };
        }
        return {
          type: 'FeatureCollection',
          features: [{
            type: 'Feature',
            properties: {},
            geometry: { type: 'LineString', coordinates: points }
          }]
        };
      }

      window.quickRideInitialize = function (token, longitude, latitude, zoom) {
        if (!window.mapboxgl) {
          showError('Map renderer could not be loaded. Check your internet connection.');
          return;
        }
        if (map) return;
        mapboxgl.accessToken = token;
        try {
          map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/standard',
            center: [longitude, latitude],
            zoom: zoom,
            attributionControl: true,
            cooperativeGestures: false
          });
          map.addControl(new mapboxgl.NavigationControl({ showCompass: true }), 'top-right');
          map.on('load', function () {
            map.addSource('quick-ride-route', {
              type: 'geojson',
              data: toFeatureCollection([])
            });
            map.addLayer({
              id: 'quick-ride-route-line',
              type: 'line',
              source: 'quick-ride-route',
              layout: { 'line-join': 'round', 'line-cap': 'round' },
              paint: { 'line-color': '#2167d5', 'line-width': 5, 'line-opacity': 0.95 }
            });
            map.on('click', function (event) {
              bridge(JSON.stringify({
                type: 'tap',
                latitude: event.lngLat.lat,
                longitude: event.lngLat.lng
              }));
            });
            bridge('ready');
            if (pendingUpdate) {
              window.quickRideUpdate(pendingUpdate);
              pendingUpdate = null;
            }
            window.setTimeout(function () { map.resize(); }, 100);
          });
          map.on('error', function (event) {
            if (!map.loaded() && event && event.error) {
              showError('Mapbox could not load the map style. Check your connection and token.');
            }
          });
        } catch (error) {
          showError('Mapbox initialization failed.');
        }
      };

      window.quickRideUpdate = function (payload) {
        if (!map || !map.isStyleLoaded()) {
          pendingUpdate = payload;
          return;
        }
        const current = payload.currentPosition;
        setMarker('current', current, payload.showUserLocation === true);
        setMarker('pickup', payload.pickup, true);
        setMarker('destination', payload.destination, true);
        const source = map.getSource('quick-ride-route');
        if (source) source.setData(toFeatureCollection(payload.route || []));
        if (payload.followCurrentPosition && current) {
          map.easeTo({
            center: [current.longitude, current.latitude],
            zoom: payload.navigationCamera ? 17 : 15.5,
            bearing: payload.navigationCamera ? 0 : map.getBearing(),
            duration: 350
          });
        }
      };

      window.quickRideMoveTo = function (longitude, latitude, zoom) {
        if (!map) return;
        const options = { center: [longitude, latitude], duration: 350 };
        if (typeof zoom === 'number') options.zoom = zoom;
        map.easeTo(options);
      };

      window.quickRideFitRoute = function (coordinates, padding) {
        if (!map || !Array.isArray(coordinates) || coordinates.length < 2) return;
        const bounds = new mapboxgl.LngLatBounds(coordinates[0], coordinates[0]);
        coordinates.forEach(function (point) { bounds.extend(point); });
        map.fitBounds(bounds, { padding: padding || 48, maxZoom: 16, duration: 450 });
      };

      window.quickRideRotate = function (degrees) {
        if (map) map.easeTo({ bearing: degrees, duration: 300 });
      };

      window.addEventListener('resize', function () {
        if (map) map.resize();
      });
      window.setTimeout(function () {
        if (!map) showError('Mapbox is taking longer than expected to load. Please retry.');
      }, 20000);
    })();
  </script>
</body>
</html>
