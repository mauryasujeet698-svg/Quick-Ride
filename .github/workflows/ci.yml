name: Quick-Ride Flutter CI
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve workspace
        run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed apps packages
      - name: Analyze applications
        run: |
          for app in apps/customer_app apps/driver_app apps/admin_app; do
            (cd "$app" && flutter analyze --no-pub)
          done
      - name: Run smoke tests
        run: |
          for app in apps/customer_app apps/driver_app apps/admin_app; do
            (cd "$app" && flutter test --no-pub)
          done
