name: Build Quick-Ride Android QA APKs
on:
  push:
    branches: ['feature/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://czbelhtemzklcmssumpc.supabase.co' }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_0es_pudIg1ghhsSciZL_Sw_LGaiO7zh' }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_CUSTOMER_APP_ID: ${{ secrets.FIREBASE_CUSTOMER_APP_ID }}
      FIREBASE_DRIVER_APP_ID: ${{ secrets.FIREBASE_DRIVER_APP_ID }}
      FIREBASE_ADMIN_APP_ID: ${{ secrets.FIREBASE_ADMIN_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve Flutter workspace
        run: flutter pub get
      - name: Prepare Android platform files
        shell: bash
        run: |
          set -euo pipefail
          for app in customer driver admin; do
            temp_dir="$(mktemp -d)"
            flutter create --empty --project-name "$app" --org in.quickride --platforms android "$temp_dir"
            cp -R "$temp_dir/android" "apps/${app}_app/android"
            manifest="apps/${app}_app/android/app/src/main/AndroidManifest.xml"
            python3 scripts/configure_android_manifest.py "$manifest" "in.quickride.${app}"
          done
      - name: Build customer APK
        run: |
          cd apps/customer_app
          flutter build apk --debug --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_CUSTOMER_APP_ID"
      - name: Build driver APK
        run: |
          cd apps/driver_app
          flutter build apk --debug --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_DRIVER_APP_ID"
      - name: Build admin APK
        run: |
          cd apps/admin_app
          flutter build apk --debug --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_ADMIN_APP_ID"
      - name: Name QA APKs and create checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp apps/customer_app/build/app/outputs/flutter-apk/app-debug.apk dist/quick-ride-customer.apk
          cp apps/driver_app/build/app/outputs/flutter-apk/app-debug.apk dist/quick-ride-driver.apk
          cp apps/admin_app/build/app/outputs/flutter-apk/app-debug.apk dist/quick-ride-admin.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: quick-ride-android-qa-apks
          path: dist/*
          if-no-files-found: error
